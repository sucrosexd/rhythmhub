<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">RhythmHub</h1>
            <button class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Главная</a></li>
                <li><a href="catalog.html" class="nav-link">Каталог</a></li>
                <li><a href="login.html" class="nav-link">Вход</a></li>
                <li><a href="register.html" class="nav-link">Регистрация</a></li>
            </ul>
        </div>
    </nav>

    <main class="form-container">
        <div class="form-wrapper">
            <h2>Вход в аккаунт</h2>
            <form id="loginForm" class="form">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" name="email" required>
                    <span class="error-message" id="loginEmailError"></span>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Пароль</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="loginPassword" name="password" required>
                        <button type="button" class="toggle-password" id="toggleLoginPassword">👁️</button>
                    </div>
                    <span class="error-message" id="loginPasswordError"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Войти</button>
                <p class="form-footer">Нет аккаунта? <a href="register.html">Зарегистрируйтесь</a></p>
            </form>
        </div>
    </main>

    <footer>
        <p>2026 RhythmHub.</p>
    </footer>

    <script src="js/validation.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>
